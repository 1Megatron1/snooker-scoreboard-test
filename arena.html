<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Snooker Arena - Snookershot Layout</title>
    <link rel="stylesheet" href="style.css?v=6">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="arena-mode">

    <div class="snooker-scoreboard-card">
        
        <!-- ВЕРХНЯЯ ЧАСТЬ: Игроки и Центр -->
        <div class="scoreboard-main-row">
            
            <!-- ИГРОК 1 (Фото слева, имя ближе к центру) -->
            <div class="player-side p1-side" id="arena-p1">
                <div class="player-photo-container">
                    <img id="p1_photo_img" src="https://via.placeholder.com/150" alt="Player 1">
                    <!-- Счет во фрейме ПОД фоткой в отдельном боксе -->
                    <div class="player-score-box" id="p1_score">0</div>
                </div>
                
                <div class="player-info-block">
                    <div class="player-name" id="p1_name">PLAYER 1</div>
                    <div class="frames-box"><span id="p1_frames">0</span></div>
                </div>
            </div>

            <!-- ЦЕНТРАЛЬНАЯ ЛИНИЯ И СТАТИСТИКА -->
            <div class="center-divider-column">
                <div class="vertical-line"></div>
                <div class="break-center-box">
                    <span class="break-title">BREAK</span>
                    <div class="break-value" id="current_break">0</div>
                </div>
                <div class="remaining-pts-box">REM: <b id="pts_remaining">147</b></div>
            </div>

            <!-- ИГРОК 2 (Имя ближе к центру, фото справа) -->
            <div class="player-side p2-side" id="arena-p2">
                <div class="player-info-block right-align">
                    <div class="player-name" id="p2_name">PLAYER 2</div>
                    <div class="frames-box"><span id="p2_frames">0</span></div>
                </div>

                <div class="player-photo-container">
                    <img id="p2_photo_img" src="https://via.placeholder.com/150" alt="Player 2">
                    <!-- Счет во фрейме ПОД фоткой в отдельном боксе -->
                    <div class="player-score-box" id="p2_score">0</div>
                </div>
            </div>

        </div>

        <!-- НИЖНЯЯ ЧАСТЬ: Под центральной линией (Максимум фреймов) -->
        <div class="scoreboard-footer-row">
            <div class="max-frames-badge">BEST OF <span id="max_frames">5</span> FRAMES</div>
        </div>

    </div>

    <script>
	const SUPABASE_URL = 'https://hljrikalmcsaencxonuz.supabase.co';
	const SUPABASE_KEY = 'sb_publishable_9yuDAfIJnsQJpL9w1eS_Ig_o66RWYr-';
      const MATCH_ID = 1;

      const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

      function renderData(data) {
          if (!data) return;
          document.getElementById('p1_name').innerText = data.p1_name || 'Player 1';
          document.getElementById('p2_name').innerText = data.p2_name || 'Player 2';
          document.getElementById('p1_score').innerText = data.p1_score || 0;
          document.getElementById('p2_score').innerText = data.p2_score || 0;
          document.getElementById('p1_frames').innerText = data.p1_frames || 0;
          document.getElementById('p2_frames').innerText = data.p2_frames || 0;
          document.getElementById('current_break').innerText = data.current_break || 0;

          if (data.p1_photo) document.getElementById('p1_photo_img').src = data.p1_photo;
          if (data.p2_photo) document.getElementById('p2_photo_img').src = data.p2_photo;

          const reds = data.reds_on_table ?? 15;
          document.getElementById('pts_remaining').innerText = (reds * 8) + 27;

          document.getElementById('arena-p1').classList.toggle('active-turn', data.active_player === 'p1');
          document.getElementById('arena-p2').classList.toggle('active-turn', data.active_player === 'p2');
      }

      async function loadInitialData() {
          const { data } = await _supabase.from('matches').select('*').eq('id', MATCH_ID).single();
          renderData(data);
      }
      loadInitialData();

      _supabase
        .channel('schema-db-changes')
        .on('postgres_changes', 
            { event: 'UPDATE', schema: 'public', table: 'matches', filter: `id=eq.${MATCH_ID}` },
            (payload) => { renderData(payload.new); }
        )
        .subscribe();

      setInterval(loadInitialData, 2000);
    </script>
</body>
</html>
