<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Snooker Arena Screen</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="arena-mode">

    <div class="arena-container">
        <!-- Игрок 1 -->
        <div class="arena-player" id="arena-p1">
            <div class="arena-photo-wrap">
                <img id="p1_photo_img" src="https://via.placeholder.com/150" alt="Player 1">
            </div>
            <div class="arena-info">
                <h2 id="p1_name">Player 1</h2>
                <div class="arena-score-box">
                    <span class="arena-label">FR: <b id="p1_frames">0</b></span>
                    <div class="arena-score" id="p1_score">0</div>
                </div>
            </div>
        </div>

        <!-- Центральный блок: Брейк и Остаток очков -->
        <div class="arena-center">
            <div class="arena-break-card">
                <span>BREAK</span>
                <div id="current_break">0</div>
            </div>
            <div class="arena-pts-left">
                REMAINING: <b id="pts_remaining">147</b>
            </div>
        </div>

        <!-- Игрок 2 -->
        <div class="arena-player" id="arena-p2">
            <div class="arena-info right">
                <h2 id="p2_name">Player 2</h2>
                <div class="arena-score-box">
                    <div class="arena-score" id="p2_score">0</div>
                    <span class="arena-label">FR: <b id="p2_frames">0</b></span>
                </div>
            </div>
            <div class="arena-photo-wrap">
                <img id="p2_photo_img" src="https://via.placeholder.com/150" alt="Player 2">
            </div>
        </div>
    </div>

    <script>
      const SUPABASE_URL = 'https://YOUR_PROJECT_ID.supabase.co';
      const SUPABASE_KEY = 'YOUR_ANON_KEY';
      const MATCH_ID = 1;

      const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

      function renderData(data) {
          if (!data) return;
          document.getElementById('p1_name').innerText = data.p1_name || 'Player 1';
          document.getElementById('p2_name').innerText = data.p2_name || 'Player 2';
          document.getElementById('p1_score').innerText = data.p1_score || 0;
          document.getElementById('p2_score').innerText = data.p2_score || 0;
          document.getElementById('p1_frames').innerText = data.p1_frames || 0;
          document.getElementById('p2_frames').innerText = data.p2_frames || 0;
          document.getElementById('current_break').innerText = data.current_break || 0;

          if (data.p1_photo) document.getElementById('p1_photo_img').src = data.p1_photo;
          if (data.p2_photo) document.getElementById('p2_photo_img').src = data.p2_photo;

          const reds = data.reds_on_table ?? 15;
          document.getElementById('pts_remaining').innerText = (reds * 8) + 27;

          // Подсветка активного игрока (у кого сейчас ход)
          document.getElementById('arena-p1').classList.toggle('active-turn', data.active_player === 'p1');
          document.getElementById('arena-p2').classList.toggle('active-turn', data.active_player === 'p2');
      }

      async function loadInitialData() {
          const { data } = await _supabase.from('matches').select('*').eq('id', MATCH_ID).single();
          renderData(data);
      }
      loadInitialData();

      _supabase
        .channel('schema-db-changes')
        .on('postgres_changes', 
            { event: 'UPDATE', schema: 'public', table: 'matches', filter: `id=eq.${MATCH_ID}` },
            (payload) => { renderData(payload.new); }
        )
        .subscribe();

      setInterval(loadInitialData, 2000);
    </script>
</body>
</html>
