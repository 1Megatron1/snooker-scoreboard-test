<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Snooker Live Scoreboard</title>
    <link rel="stylesheet" href="style.css?v=10">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="display-mode">

    <div class="scoreboard">
        <div class="player" id="p1-block">
            <h2 id="p1_name">Player 1</h2>
            <div class="frames" id="p1_frames">0</div>
            <div class="score" id="p1_score">0</div>
        </div>

        <div class="match-info">
            <div class="break-box">
                <span>BREAK</span>
                <div id="current_break">0</div>
            </div>
        </div>

        <div class="player" id="p2-block">
            <h2 id="p2_name">Player 2</h2>
            <div class="frames" id="p2_frames">0</div>
            <div class="score" id="p2_score">0</div>
        </div>
    </div>

    <div id="qr-container">
        <p>Mobile Control:</p>
        <img id="qr-image" src="" alt="QR Code" style="width:128px; height:128px;">
    </div>

    <script>
	const SUPABASE_URL = 'https://hljrikalmcsaencxonuz.supabase.co';
	const SUPABASE_KEY = 'sb_publishable_9yuDAfIJnsQJpL9w1eS_Ig_o66RWYr-';
      const MATCH_ID = 1;

      const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

      const controlUrl = window.location.href.replace('index.html', '').replace(/\/$/, '') + '/control.html';
      document.getElementById('qr-image').src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(controlUrl)}`;

      function renderData(data) {
          if (!data) return;
          document.getElementById('p1_name').innerText = data.p1_name || 'Player 1';
          document.getElementById('p2_name').innerText = data.p2_name || 'Player 2';
          document.getElementById('p1_score').innerText = data.p1_score || 0;
          document.getElementById('p2_score').innerText = data.p2_score || 0;
          document.getElementById('p1_frames').innerText = data.p1_frames || 0;
          document.getElementById('p2_frames').innerText = data.p2_frames || 0;
          document.getElementById('current_break').innerText = data.current_break || 0;

          document.getElementById('p1-block').classList.toggle('active-turn', data.active_player === 'p1');
          document.getElementById('p2-block').classList.toggle('active-turn', data.active_player === 'p2');
      }

      async function loadInitialData() {
          const { data } = await _supabase.from('matches').select('*').eq('id', MATCH_ID).single();
          renderData(data);
      }
      loadInitialData();

      _supabase
        .channel('schema-db-changes')
        .on('postgres_changes', 
            { event: 'UPDATE', schema: 'public', table: 'matches', filter: `id=eq.${MATCH_ID}` },
            (payload) => { renderData(payload.new); }
        )
        .subscribe();

      setInterval(loadInitialData, 2000);
    </script>
</body>
</html>
